# Link checking for the built site.
#
# Two passes, because the two kinds of link deserve different treatment.
#
# Internal links must never break: a bad path in a post is invisible in the
# Hugo build but a 404 for every reader. `mise run links` checks those with
# --offline -- no network, deterministic, and it fails the build.
#
# External links rot on someone else's schedule and can fail for reasons that
# have nothing to do with this repository. `mise run links:external` reports
# them without failing. This split used to be described in this comment and not
# actually implemented, which is how a release broke on the theme's own
# "Powered by Blowfish" footer link being unreachable from a CI runner while
# returning 200 everywhere else.

cache = true
max_cache_age = "2d"
max_concurrency = 8
max_redirects = 5
timeout = 20
retry_wait_time = 2
max_retries = 2

include_verbatim = false
# lychee 0.24 replaced the boolean with a mode. "anchor-only" checks #section
# links, which is what the theme's table of contents emits; text fragments
# (#:~:text=) appear nowhere here and resolving them is pure cost.
include_fragments = "anchor-only"

# Presented as a real browser: several sites 403 anything that is not.
user_agent = "Mozilla/5.0 (compatible; lychee/0.20; +https://blog.brokenbymega.ovh)"

exclude_all_private = true
exclude_loopback = true

exclude = [
  # The site is not yet reachable at its production URL while CI runs.
  "^https://blog\\.brokenbymega\\.ovh",
  # Rate-limits unauthenticated HEAD requests from CI runners.
  "^https://(www\\.)?linkedin\\.com",
  "^https://(www\\.)?x\\.com",
  "^https://twitter\\.com",
  # Share-intent endpoints. The theme builds these with the post title and URL
  # in a #fragment or query string; there is no anchor to resolve, so
  # include_fragments reports them as broken. They are generated by the theme,
  # never hand-written, so there is nothing here a post could get wrong.
  "^https://share\\.joinmastodon\\.org",
  "^https://(www\\.)?reddit\\.com/submit",
  "^https://(www\\.)?facebook\\.com/sharer",
  "^https://api\\.whatsapp\\.com/send",
  "^https://telegram\\.me/share",
]

accept = ["200..=204", "206", "429"]
