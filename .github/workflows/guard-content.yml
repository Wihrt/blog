---
name: Guard

# Confines each automated author to the files it has business changing.
#
# There are two of them and they are not the same. The content workflow adds
# articles and must never touch the build; Renovate updates dependency
# manifests and must never touch articles. Treating both as "not the owner" and
# allowing only content blocked every Renovate pull request, which is what this
# file used to do.
#
# Branch protection requires this check, so it fails closed: no green run, no
# merge.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard automated pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      # Labels live on the issues API, and this job creates them.
      issues: write
    steps:
      - name: Classify the author
        id: author
        env:
          ACTOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          # Matched as literal strings: "renovate[bot]" contains [ ] which a
          # shell case pattern would read as a character class.
          if [ "$ASSOCIATION" = "OWNER" ]; then
            profile=owner
          elif [ "$ACTOR" = "renovate[bot]" ] || [ "$ACTOR" = "app/renovate" ]; then
            profile=dependencies
          else
            profile=content
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "Author '$ACTOR' (association '$ASSOCIATION') -> profile '$profile'."

      - uses: actions/checkout@v5
        # pull_request_target runs with repository secrets, so the untrusted
        # head is only ever read as data: nothing from the branch is executed.
        with:
          fetch-depth: 0

      - name: Collect changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=50 origin "$BASE_SHA" "$HEAD_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed.txt
          echo "Changed files:"
          sed 's/^/  /' /tmp/changed.txt

      - name: Enforce the allowlist for this author
        env:
          PROFILE: ${{ steps.author.outputs.profile }}
        run: |
          case "$PROFILE" in
            owner)
              echo "Owner pull request; no path restriction."
              exit 0
              ;;
            dependencies)
              # Everything Renovate has a manager for, and nothing else. It has
              # no business writing articles or editing the chart's values,
              # which the release workflow owns.
              allowed='^(mise\.toml|go\.(mod|sum)|renovate\.json|cog\.toml|Dockerfile|compose\.yaml|\.pre-commit-config\.yaml|\.github/workflows/)'
              why='Renovate may only update dependency manifests'
              ;;
            content)
              allowed='^(content/|assets/images/|static/images/)'
              why='an automated content pull request may only touch content'
              ;;
          esac

          violations="$(grep -Ev "$allowed" /tmp/changed.txt || true)"
          if [ -n "$violations" ]; then
            echo "::error::Rejected: $why."
            echo "$violations" | while read -r f; do
              echo "::error file=$f::$f is outside the '$PROFILE' allowlist"
            done
            exit 1
          fi
          echo "All changed paths are within the '$PROFILE' allowlist."

      - name: Reject an automated change to the tag vocabulary
        if: steps.author.outputs.profile == 'content'
        run: |
          # data/tags.yaml is deliberately outside the content allowlist above.
          # Widening the taxonomy is a human decision; without this an automated
          # author could invent a tag and authorise it in the same pull request,
          # which would defeat the vocabulary check entirely.
          if grep -q '^data/tags\.yaml$' /tmp/changed.txt; then
            echo "::error file=data/tags.yaml::Add new tags in a separate, human-authored pull request."
            exit 1
          fi

      - name: Require a conventional pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The squash commit takes the pull request title, and cog derives the
          # version from it. A non-conventional title would publish a build
          # under the wrong version, or none at all.
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{5,}'; then
            echo "::error::Pull request title must be a conventional commit, e.g. 'feat(content): add a post about Cilium'."
            echo "Got: $TITLE"
            exit 1
          fi

      - name: Require exactly one post per automated pull request
        if: steps.author.outputs.profile == 'content'
        run: |
          # One post per pull request keeps the version history readable and
          # makes a revert a single, obvious operation.
          posts="$(grep -c '^content/posts/.*\.md$' /tmp/changed.txt || true)"
          if [ "$posts" -gt 1 ]; then
            echo "::error::$posts posts in one pull request; open one per article."
            exit 1
          fi

      - name: Label the pull request
        if: steps.author.outputs.profile != 'owner'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PROFILE: ${{ steps.author.outputs.profile }}
        run: |
          # auto-merge.yml gates on the 'content' label, so a pull request that
          # fails to get labelled never merges. The labels are created here
          # rather than assumed to exist in the repository: they did not, and
          # because this step used to end in `|| true` the failure was silent --
          # every automated pull request would have sat open forever with every
          # check green.
          gh label create automated    --color ededed --force \
            --description "Opened by automation, not by a person"
          gh label create content      --color 0e8a16 --force \
            --description "Adds or edits an article"
          gh label create dependencies --color 1d76db --force \
            --description "Dependency manifest update"

          # No `|| true`. If labelling fails the merge must not proceed
          # silently: this check is required, so failing here fails closed.
          gh pr edit "$PR" --add-label automated --add-label "$PROFILE"
