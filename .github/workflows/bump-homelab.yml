---
name: Bump homelab

# Closes the loop: raises the blog chart version in the GitOps repository so
# ArgoCD picks up the release. Only the chart version moves there -- the image
# digest lives inside the chart, which keeps that repository's convention of a
# single semver on the line after a `# renovate:` comment intact.
#
# The bump is committed straight to main rather than proposed as a pull
# request: one line changes, and the chart it points at has already been
# linted, templated, unit-tested and kubeconform-validated by the release that
# produced it. The cost is that the homelab repository's own checks never see
# the change.
#
# Since there is no pull request, nothing here calls the GitHub API -- only
# clone, fetch and push. A fine-grained token scoped to the homelab repository
# with Contents: Read and write is therefore the whole requirement. That claim
# only holds because the checkout below pins `ref`; left to default it would
# call the repository API to resolve the default branch.

on:
  workflow_call:
    inputs:
      version:
        description: Chart and image version to roll out
        required: true
        type: string
      digest:
        description: Image digest, quoted in the commit message for traceability
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Chart version to roll out
        required: true
        type: string

permissions:
  contents: read

env:
  HOMELAB_REPO: ${{ github.repository_owner }}/homelab
  HOMELAB_FILE: kubernetes/bootstrap/argocd/homelab.yaml

jobs:
  bump:
    name: Commit the version bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the homelab token can actually read the repository
        # The built-in GITHUB_TOKEN is scoped to this repository and cannot
        # write to another one, so a separate credential is required.
        #
        # Presence is not the useful check. A token that is set but expired or
        # scoped to the wrong repositories fails inside actions/checkout as
        # "Not Found", because GitHub answers 404 rather than 403 for a private
        # repository a credential cannot see -- which reads like a typo in the
        # repository name and is not. So test the capability the bump needs,
        # reading a ref, and say what to look at when it is missing.
        env:
          HOMELAB_TOKEN: ${{ secrets.HOMELAB_TOKEN }}
        run: |
          if [ -z "$HOMELAB_TOKEN" ]; then
            echo "::error::HOMELAB_TOKEN is not set. Create a fine-grained personal access token"
            echo "::error::scoped to $HOMELAB_REPO with Contents: Read and write, then store it as"
            echo "::error::the HOMELAB_TOKEN secret in this repository."
            exit 1
          fi

          # Output discarded: git echoes the remote URL, token included, when
          # it fails. Actions masks registered secrets, but not relying on that
          # costs nothing here since the message below is the useful one.
          if ! git ls-remote \
              "https://x-access-token:${HOMELAB_TOKEN}@github.com/${HOMELAB_REPO}.git" \
              main >/dev/null 2>&1; then
            echo "::error::HOMELAB_TOKEN cannot read $HOMELAB_REPO."
            echo "::error::$HOMELAB_REPO is private, so a token without access gets 404, not 403;"
            echo "::error::a wrong name and a wrong scope look identical from here."
            echo "::error::Check, in order: the token has not expired; its resource owner is"
            echo "::error::$GITHUB_REPOSITORY_OWNER; repository access names $HOMELAB_REPO explicitly"
            echo "::error::rather than 'Public repositories'; and it grants Contents: Read and write."
            echo "::error::See docs/homelab-integration.md."
            exit 1
          fi
          echo "Token can read $HOMELAB_REPO."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.HOMELAB_REPO }}
          token: ${{ secrets.HOMELAB_TOKEN }}
          path: homelab
          fetch-depth: 0
          # Pinned rather than left to default. Without a ref, checkout calls
          # GET /repos/{owner}/{repo} to discover the default branch -- an API
          # call this job is documented as not making, and one more thing that
          # can 404. The bump pushes to main explicitly further down, so main
          # is the branch to start from.
          ref: main

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
          install: false
          tool_versions: |
            yq 4.48.1

      - name: Raise the chart version
        id: edit
        working-directory: homelab
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ ! -f "$HOMELAB_FILE" ]; then
            echo "::error::$HOMELAB_FILE not found in $HOMELAB_REPO"
            exit 1
          fi

          current="$(yq -r '.applications.blog.helm.chart.version // ""' "$HOMELAB_FILE")"
          if [ -z "$current" ]; then
            echo "::error::No 'blog' application in $HOMELAB_FILE."
            echo "::error::Add it once by hand (see charts/blog/README.md); this workflow only bumps an existing entry."
            exit 1
          fi

          if [ "$current" = "$VERSION" ]; then
            echo "Already at $VERSION."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # yq rewrites in place and preserves the surrounding `# renovate:`
          # comment, which the homelab's regex manager depends on.
          VERSION="$VERSION" yq -i \
            '.applications.blog.helm.chart.version = strenv(VERSION)' "$HOMELAB_FILE"

          updated="$(yq -r '.applications.blog.helm.chart.version' "$HOMELAB_FILE")"
          if [ "$updated" != "$VERSION" ]; then
            echo "::error::Rewrite did not take effect (still '$updated')."
            exit 1
          fi
          if ! grep -B2 -F "\"$VERSION\"" "$HOMELAB_FILE" | grep -q '# renovate:'; then
            echo "::warning::The renovate comment above the blog chart version appears to have been lost."
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "previous=$current" >> "$GITHUB_OUTPUT"
          git --no-pager diff -- "$HOMELAB_FILE"

      - name: Commit the bump straight to main
        if: steps.edit.outputs.changed == 'true'
        working-directory: homelab
        env:
          VERSION: ${{ inputs.version }}
          PREVIOUS: ${{ steps.edit.outputs.previous }}
          DIGEST: ${{ inputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # OCI paths quoted in the message must be lowercase to be
          # copy-pastable; github.repository keeps the account's capitalisation.
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          repo_lc="${GITHUB_REPOSITORY,,}"
          image_ref="ghcr.io/${repo_lc}:${VERSION}"
          [ -n "$DIGEST" ] && image_ref="${image_ref}@${DIGEST}"

          # Built with printf rather than a heredoc: a heredoc indented to match
          # the YAML block would carry its leading spaces into the message, and
          # its terminator cannot be indented at all.
          printf '%s\n\n%s\n\n%s\n%s\n\n%s\n%s\n\n%s\n' \
            "chore(blog): bump chart to ${VERSION}" \
            "Rolls the blog out to ${VERSION} (was ${PREVIOUS})." \
            "Chart: oci://ghcr.io/${owner_lc}/charts/blog:${VERSION}" \
            "Image: ${image_ref}" \
            "The chart pins the image by digest internally, so this single" \
            "version change resolves one immutable build." \
            "Pushed by ${RUN_URL}" > /tmp/commit-msg.txt

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$HOMELAB_FILE"
          git commit -F /tmp/commit-msg.txt

          # Renovate or a person may have pushed between the checkout and now.
          # Rebase and retry rather than fail a release whose artifacts are
          # already published and immutable.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed to $HOMELAB_REPO on attempt $attempt."
              exit 0
            fi
            echo "::notice::Push rejected (attempt $attempt); rebasing onto the current main."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase failed; the blog entry may have been edited concurrently."
              exit 1
            fi
            sleep $(( attempt * 3 ))
          done

          echo "::error::Could not push to $HOMELAB_REPO after 5 attempts."
          exit 1
