---
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_YES: "1"

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Cache pre-commit environments
        # Measured: creating these environments took 64s of this job's 93s,
        # while running the hooks took seconds. The key covers both the hook
        # definitions and mise.toml, which pins the pre-commit version itself;
        # restore-keys give a partial hit so that changing one hook rebuilds
        # only that hook's environment.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.toml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Hugo modules
        # The theme is a Go module fetched on every build. go.sum pins it
        # exactly, so the key is exact too.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hugo_cache
            ~/go/pkg/mod
          key: hugo-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            hugo-mod-${{ runner.os }}-

      - name: Install Helm plugins
        run: |
          # Helm 4 refuses plugin sources without provenance unless verification
          # is waived, and neither plugin publishes signatures. Versions are
          # pinned so a plugin release cannot change chart rendering or test
          # results without a commit here.
          helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.1.2 --verify=false
          helm plugin install https://github.com/dadav/helm-schema --version 0.23.4 --verify=false

      - name: Run every pre-commit hook
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Exercise the release tooling
        # release.yml never runs on a pull request, so nothing here used to
        # prove cog was even installed -- a missing mise.toml entry shipped
        # unnoticed and would have failed only at release time. `cog bump`
        # itself cannot be rehearsed: branch_whitelist refuses any branch but
        # main, dry-run included.
        run: |
          cog --version
          # --from-latest-tag exits non-zero when no tag exists at all, which is
          # the state before the first release; and without it cog would scan
          # back into the two non-conventional commits from the Astro scaffold.
          # So check only once there is a tag to check from.
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
           # On PRs, individual commits are squash-merged so only warn;
           # on merge_group the final commit message is validated strictly.
           if [ "${{ github.event_name }}" = "pull_request" ]; then
             cog check --from-latest-tag --ignore-merge-commits || \
               echo "::warning::Non-conventional commits found; ensure the PR title follows conventional commits for the squash merge."
           else
             cog check --from-latest-tag --ignore-merge-commits
           fi
         else
           echo "::notice::No release tag yet; commit-message check starts after the first release."
         fi

      - name: Exercise the commit-message hook
        # `pre-commit run --all-files` skips commit-msg stage hooks, so this
        # one was never covered either. Assert it both accepts and rejects.
        run: |
          # cog verify builds a commit object to validate against, so it needs a
          # committer identity and panics without one. A real commit always has
          # it -- git refuses to commit otherwise -- but a CI runner does not.
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          printf 'feat(content): a conventional message\n' > /tmp/ok.txt
          printf 'not a conventional message\n' > /tmp/bad.txt
          if ! pre-commit run --hook-stage commit-msg conventional-commit \
               --commit-msg-filename /tmp/ok.txt; then
            echo "::error::The commit-message hook rejected a valid message."
            exit 1
          fi
          if pre-commit run --hook-stage commit-msg conventional-commit \
             --commit-msg-filename /tmp/bad.txt; then
            echo "::error::The commit-message hook accepted an invalid message."
            exit 1
          fi
          echo "Commit-message hook accepts valid and rejects invalid messages."

      - name: Fail if a generated file is stale
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'mise run lint' and commit the result."
            git --no-pager diff
            exit 1
          fi

  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Cache Hugo modules
        # The theme is a Go module fetched on every build. go.sum pins it
        # exactly, so the key is exact too.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hugo_cache
            ~/go/pkg/mod
          key: hugo-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            hugo-mod-${{ runner.os }}-

      - name: Validate post front matter
        run: mise run validate

      - name: Build (warnings are fatal)
        run: mise run build

      - name: Check internal links
        # Blocking, offline, no network. A broken path in a post is a 404 for
        # every reader and must stop the pipeline.
        run: mise run links

      - name: Report unreachable external links
        # Never blocking. An external site can be down, rate-limit CI runners,
        # or block their address ranges, none of which says anything about this
        # repository -- the first release failed on the theme's own footer link
        # being unreachable from a runner while serving 200 everywhere else.
        if: always()
        run: |
          {
            echo "## External links"
            echo
            echo '```'
            mise run links:external 2>&1 | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/
          retention-days: 3

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Install Helm plugins
        run: |
          # Helm 4 refuses plugin sources without provenance unless verification
          # is waived, and neither plugin publishes signatures. Versions are
          # pinned so a plugin release cannot change chart rendering or test
          # results without a commit here.
          helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.1.2 --verify=false

      - run: mise run helm:lint
      - run: mise run helm:test
      - run: mise run helm:verify

      - name: Refuse a chart whose image is not pinned by digest
        # A published chart must never point at a mutable tag: the homelab repo
        # tracks nothing but the chart version, so the digest is the only thing
        # tying a release to one immutable build.
        run: |
          digest="$(yq -r '.image.digest' charts/blog/values.yaml)"
          version="$(yq -r '.version' charts/blog/Chart.yaml)"
          app="$(yq -r '.appVersion' charts/blog/Chart.yaml)"
          if [ "$version" != "$app" ]; then
            echo "::error file=charts/blog/Chart.yaml::version ($version) and appVersion ($app) must match"
            exit 1
          fi
          if [ "$version" = "0.1.0" ] && [ -z "$digest" ]; then
            echo "::notice::Chart still at its bootstrap version; digest check skipped."
            exit 0
          fi
          case "$digest" in
            sha256:*) echo "Chart $version pinned to $digest" ;;
            *) echo "::error file=charts/blog/values.yaml::image.digest must be a sha256 digest"; exit 1 ;;
          esac

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: blog:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify it runs the way Kubernetes runs it
        # Runs through compose.yaml so the read-only root, unprivileged user and
        # dropped capabilities are asserted from the same definition developers
        # use locally, rather than from a second copy that can drift. Each of
        # those constraints has already broken this image once: Caddy's XDG
        # paths need a writable /tmp, and its binary carried
        # cap_net_bind_service, which cannot be exec'd with all capabilities
        # dropped.
        #
        # --no-build guarantees the image under test is the one buildx produced
        # above; --wait blocks until the container's healthcheck passes.
        env:
          BLOG_IMAGE: blog:ci
        run: |
          docker compose up --detach --no-build --wait
          fail=0
          check() {
            actual="$(curl -so /dev/null -w '%{http_code}' "http://localhost:8080$1")"
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 returned $actual, expected $2"
              fail=1
            fi
          }
          check /healthz 200
          check / 200
          check /index.xml 200
          check /index.json 200
          check /robots.txt 200
          check /sitemap.xml 200
          check /definitely-not-here 404

          # An article has to be served, but no article in particular. This
          # used to name a slug, and deleting that post failed the image job
          # for a reason that had nothing to do with the image. Same reasoning
          # as the asset check below: discover it from the rendered page.
          post="$(curl -s http://localhost:8080/ \
            | grep -oE '/posts/[A-Za-z0-9._-]+/' | head -1)"
          if [ -z "$post" ]; then
            echo "::error::No article link found on the home page"
            fail=1
          else
            check "$post" 200
            echo "Article serving confirmed on $post"
          fi
          curl -sI http://localhost:8080/ | grep -qi '^x-content-type-options: nosniff' \
            || { echo "::error::security headers missing"; fail=1; }

          # The immutable matcher in the Caddyfile lists theme-specific asset
          # paths. A theme change moves them, the matcher stops matching, and
          # long-lived caching silently disappears -- so assert on a real asset
          # discovered from the rendered page rather than a hardcoded path.
          asset="$(curl -s http://localhost:8080/ \
            | grep -oE '/(css|js|lib|fonts|assets)/[A-Za-z0-9._/-]+\.(css|js)' | head -1)"
          if [ -z "$asset" ]; then
            echo "::error::No fingerprinted asset found on the home page"
            fail=1
          elif ! curl -sI "http://localhost:8080$asset" | grep -qi 'cache-control:.*immutable'; then
            echo "::error::$asset is not served with an immutable Cache-Control header"
            curl -sI "http://localhost:8080$asset" | grep -i cache-control || true
            fail=1
          else
            echo "Immutable caching confirmed on $asset"
          fi
          docker compose logs --no-color
          docker compose down --remove-orphans
          exit "$fail"

      # Vulnerability scanning is split in two on purpose.
      #
      # This image adds no packages of its own: the build stage is discarded
      # and the runtime layer is static HTML plus a Caddyfile. Every finding
      # therefore comes from the caddy:*-alpine base image, and the only
      # remediation available is a newer base image -- which is Renovate's job,
      # not this workflow's.
      #
      # Blocking on HIGH would mean blocking every release whenever upstream
      # Caddy lags a CVE fix, including releases that only add an article. A
      # gate that blocks routinely and cannot be acted on is a gate that gets
      # disabled, so it is scoped to what genuinely must stop a release.
      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blog:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Report high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blog:ci
          format: table
          output: trivy-high.txt
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH

      - name: Publish the vulnerability report
        if: always()
        run: |
          {
            echo "## Base image vulnerabilities (HIGH, not blocking)"
            echo
            echo "Findings originate in the \`caddy:*-alpine\` base image."
            echo "Renovate bumps it when upstream ships a fix."
            echo
            echo '```'
            cat trivy-high.txt 2>/dev/null || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
