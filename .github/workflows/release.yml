---
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if no commit warrants a version bump
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Never let two releases race: they would both bump the chart and open
  # conflicting bumps to the homelab repository.
  group: release
  cancel-in-progress: false

env:
  # IMAGE and CHART_REGISTRY are resolved per job rather than here: OCI paths
  # must be lowercase and github.repository keeps the account's capitalisation,
  # which GitHub expressions cannot fold.
  MISE_YES: "1"

jobs:
  verify:
    name: Verify
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    uses: ./.github/workflows/ci.yml

  version:
    name: Compute version
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # cog writes a changelog commit and a tag, and this job pushes both.
      # The workflow default is contents: read, which would fail the push.
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Configure the committer
        # cog writes a changelog commit and a tag. Without an identity it fails
        # at the commit step, which is exactly how the first release run
        # produced a green pipeline that published nothing.
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Derive the next version from the commit history
        id: bump
        env:
          FORCE: ${{ inputs.force }}
        run: |
          before="$(cog get-version 2>/dev/null || true)"

          # Deliberately not guarded. cog exits 0 when no commit warrants a
          # release and non-zero only when it genuinely fails, so the step must
          # be allowed to fail rather than mistake a crash for "nothing to do".
          # --skip-ci keeps the bump commit from re-triggering this workflow.
          cog bump --auto --skip-ci

          after="$(cog get-version 2>/dev/null || true)"

          if [ -n "$after" ] && [ "$after" != "$before" ]; then
            echo "version=$after" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $after (previous: ${before:-none})." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$FORCE" = "true" ] && [ -n "$after" ]; then
            echo "version=$after" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Republishing $after on request." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No commit since ${before:-the first commit} warrants a release; nothing was published." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push the tag and changelog
        if: steps.bump.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # cog creates lightweight tags and --follow-tags pushes annotated ones
          # only, so the tag silently stayed local. With no tag on the remote,
          # every later run recomputes the same first version and releases never
          # advance. Push the tag explicitly.
          git push origin HEAD:main
          git push origin "refs/tags/v${VERSION}"

  publish:
    name: Publish image and chart
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      # Keyless signing exchanges this token for a short-lived certificate.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve the registry paths in lowercase
        # OCI repository names must be lowercase, and both github.repository and
        # github.repository_owner preserve the account's capitalisation. The
        # image push only ever worked because mise.toml happened to define a
        # lowercase IMAGE that mise-action exported over the workflow's value;
        # CHART_REGISTRY had no such accident and failed the release with
        # `invalid reference: invalid repository "Wihrt/charts/blog"`.
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "CHART_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=blog
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Pin the chart to this exact build
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The chart version and appVersion move together, and the digest is
          # written into values.yaml. That is what lets the homelab repository
          # track a single semver while still resolving an immutable image.
          yq -i ".version = \"$VERSION\" | .appVersion = \"$VERSION\"" charts/blog/Chart.yaml
          yq -i ".image.tag = \"$VERSION\" | .image.digest = \"$DIGEST\"" charts/blog/values.yaml
          git --no-pager diff --stat charts/

      - name: Verify the pinned chart still renders
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.1.2 --verify=false
          mise run helm:lint
          mise run helm:test
          mise run helm:verify
          rendered="$(helm template blog charts/blog | yq -r 'select(.kind == "Deployment") | .spec.template.spec.containers[0].image')"
          expected="${IMAGE}:${VERSION}@${{ steps.build.outputs.digest }}"
          if [ "$rendered" != "$expected" ]; then
            echo "::error::Chart renders '$rendered' but the build produced '$expected'"
            exit 1
          fi
          echo "Chart pinned to $rendered"

      - name: Commit the pinned chart
        run: |
          # README.md and values.schema.json are generated from Chart.yaml and
          # values.yaml, so pinning the chart makes them stale. They have to be
          # regenerated and committed together: the release commit carries
          # [skip ci], so nothing notices until the next pull request fails the
          # "generated file is stale" check for changes it did not make.
          helm plugin install https://github.com/dadav/helm-schema --version 0.23.4 --verify=false
          mise run helm:docs
          mise run helm:schema

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add charts/blog/Chart.yaml charts/blog/values.yaml \
                  charts/blog/README.md charts/blog/values.schema.json
          git commit -m "chore(chart): pin blog $VERSION [skip ci]"
          git push origin HEAD:main

          if ! git diff --quiet; then
            echo "::error::Generated chart files are still dirty after the commit."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Package, push and sign the chart
        run: |
          helm package charts/blog --destination /tmp/chart
          # `helm push` prints the pushed manifest digest; capture it rather
          # than re-resolving the tag, which could have moved in between.
          helm push "/tmp/chart/blog-${VERSION}.tgz" "oci://${CHART_REGISTRY}" 2>&1 | tee /tmp/push.log
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' /tmp/push.log | head -1)"
          if [ -z "$digest" ]; then
            echo "::error::helm push did not report a digest; refusing to publish an unsigned chart."
            exit 1
          fi
          cosign sign --yes "${CHART_REGISTRY}/blog@${digest}"
          echo "Chart pushed and signed: ${CHART_REGISTRY}/blog:${VERSION}@${digest}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The tag was created by `cog bump` in the previous job.
          gh release view "v${VERSION}" >/dev/null 2>&1 && exit 0
          cat > /tmp/notes.md <<NOTES
          Image: \`${IMAGE}:${VERSION}@${DIGEST}\`
          Chart: \`oci://${CHART_REGISTRY}/blog:${VERSION}\`
          NOTES
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --notes-file /tmp/notes.md

  homelab:
    name: Bump homelab
    needs: [version, publish]
    if: needs.version.outputs.version != ''
    uses: ./.github/workflows/bump-homelab.yml
    with:
      version: ${{ needs.version.outputs.version }}
      digest: ${{ needs.publish.outputs.digest }}
    secrets: inherit
