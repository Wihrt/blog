apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "blog.fullname" . }}-test-connection"
  labels:
    {{- include "blog.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: healthz
      image: busybox:1.37
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - wget
      args:
        - "--spider"
        - "--tries=3"
        - "--timeout=5"
        - "http://{{ include "blog.fullname" . }}:{{ .Values.service.port }}/healthz"
