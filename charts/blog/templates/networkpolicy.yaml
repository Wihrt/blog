{{- if .Values.networkPolicy.enabled -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "blog.fullname" . }}
  labels:
    {{- include "blog.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "blog.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.ingressControllerNamespace }}
            {{- range $k, $v := .Values.networkPolicy.ingressControllerLabels }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
      toPorts:
        - ports:
            - port: {{ .Values.containerPort | quote }}
              protocol: TCP
    # kubelet probes originate from the node, not from a Cilium endpoint.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: {{ .Values.containerPort | quote }}
              protocol: TCP
  # A static file server initiates no outbound connections. Denying all egress
  # is expressed as an empty rule list, which Cilium reads as "deny everything".
  egress: []
{{- end }}
