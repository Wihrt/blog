---
suite: availability
tests:
  - it: budgets disruption when there is more than one replica
    template: poddisruptionbudget.yaml
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1

  - it: skips the budget for a single replica, which would block node drains
    template: poddisruptionbudget.yaml
    set:
      replicaCount: 1
    asserts:
      - hasDocuments:
          count: 0

  - it: keeps the budget when autoscaling floors at two replicas
    template: poddisruptionbudget.yaml
    set:
      replicaCount: 1
      autoscaling:
        enabled: true
        minReplicas: 2
    asserts:
      - hasDocuments:
          count: 1

  - it: never takes a pod down before its replacement is ready
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0

  - it: drops the replica count when autoscaling owns it
    template: deployment.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - isNull:
          path: spec.replicas
