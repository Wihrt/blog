baseURL = "https://blog.brokenbymega.ovh/"
defaultContentLanguage = "fr"
locale = "fr-FR"

# Blowfish déclare `en` dans son propre config/_default/languages.en.toml. Une
# fois le site passé en français, cette langue devenait une seconde langue et
# Hugo publiait un site anglais vide sous /en/, référencé dans le sitemap.
disableLanguages = ["en"]
title = "Wihrt's Blog"
timeZone = "Europe/Paris"

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false
buildDrafts = false
buildFuture = false
buildExpired = false
summaryLength = 0

# Fail the build instead of silently emitting a broken link.
refLinksErrorLevel = "ERROR"

[module]
  # The theme is declared here and only here. Adding a top-level `theme = ...`
  # as well mounts the module a second time, which makes its data/ files
  # collide with themselves and warns on every build.
  [[module.imports]]
    # renovate: datasource=go depName=github.com/nunocoracao/blowfish/v2
    path = "github.com/nunocoracao/blowfish/v2"

[permalinks]
  posts = "/posts/:slug/"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  series = "series"

[outputs]
  # JSON on the home page is Blowfish's search index.
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[minify]
  disableXML = true
  minifyOutput = true

[markup]
  [markup.goldmark.renderer]
    # Posts arrive from n8n; never let raw HTML through.
    unsafe = false
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  colorScheme = "blowfish"
  defaultAppearance = "dark"
  autoSwitchAppearance = true

  enableSearch = true
  enableCodeCopy = true
  enableStructuredBreadcrumbs = true

  mainSections = ["posts"]
  description = "Veille technologique et notes techniques : Kubernetes, DevOps, self-hosting et automatisation."
  fingerprintAlgorithm = "sha512"

  # Umami est auto-hébergé (https://umami.brokenbymega.ovh) ; seuls
  # /script.js et /api/send y sont publics, le dashboard reste derrière
  # Pocket ID. Blowfish n'injecte ce script qu'en build production.
  [params.umamiAnalytics]
    websiteid = "9775dbb8-9b32-41ff-8093-db13db68491b"
    domain = "umami.brokenbymega.ovh"

  [params.header]
    layout = "basic"

  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.homepage]
    layout = "page"
    showRecent = true
    showRecentItems = 10
    showMoreLink = true
    showMoreLinkDest = "/posts/"
    cardView = true

  [params.article]
    showDate = true
    showDateUpdated = true
    showAuthor = true
    showBreadcrumbs = true
    showDraftLabel = true
    showEdit = true
    editURL = "https://github.com/Wihrt/blog/edit/main/"
    editAppendPath = true
    showHeadingAnchors = true
    showPagination = true
    showReadingTime = true
    showTableOfContents = true
    showTaxonomies = true
    showTags = true
    showWordCount = true
    showRelatedContent = true
    relatedContentLimit = 3
    sharingLinks = ["linkedin", "mastodon", "reddit", "email"]

  [params.list]
    showBreadcrumbs = true
    showSummary = true
    showTableOfContents = false
    showTaxonomies = true
    groupByYear = true
    cardView = true
    cardViewScreenWidth = false

  [params.taxonomy]
    showTermCount = true
    showCardView = true

  [params.term]
    showBreadcrumbs = true
    groupByYear = true
    cardView = true

[author]
  name = "Arnaud Hatzenbuhler"
  links = [
    { github = "https://github.com/Wihrt" },
  ]

[[menu.main]]
  identifier = "posts"
  name = "Articles"
  pageRef = "posts"
  weight = 10
[[menu.main]]
  identifier = "series"
  name = "Séries"
  pageRef = "series"
  weight = 20
[[menu.main]]
  identifier = "tags"
  name = "Tags"
  pageRef = "tags"
  weight = 30
[[menu.main]]
  identifier = "about"
  name = "À propos"
  pageRef = "about"
  weight = 40
[[menu.footer]]
  name = "RSS"
  url = "/index.xml"
  weight = 10
