[settings]
experimental = true

[tools]
hugo = "0.165.0"
go = "1.27.0"
helm = "3.20.1"
helm-docs = "1.14.2"
kubeconform = "0.8.0"
hadolint = "2.15.1"
actionlint = "1.7.8"
lychee = "0.20.1"
trivy = "0.74.0"
cosign = "2.6.1"
yq = "4.48.1"
yamlfmt = "0.21.0"
pre-commit = "4.4.0"
uv = "0.9.9"

[env]
HUGO_ENV = "production"
IMAGE = "ghcr.io/wihrt/blog"

[hooks]
enter = """
pre-commit install --install-hooks >/dev/null 2>&1 || true
helm plugin list 2>/dev/null | grep -q '^schema' || helm plugin install https://github.com/dadav/helm-schema --verify=false >/dev/null 2>&1 || true
helm plugin list 2>/dev/null | grep -q '^unittest' || helm plugin install https://github.com/helm-unittest/helm-unittest >/dev/null 2>&1 || true
"""

[tasks.bootstrap]
description = "Install every local dependency (Hugo modules, pre-commit hooks, Helm plugins)"
run = [
  "hugo mod get -u ./...",
  "pre-commit install --install-hooks",
  "pre-commit install --hook-type commit-msg",
]

[tasks.dev]
description = "Run the Hugo dev server with drafts on http://localhost:1313"
run = "hugo server --buildDrafts --buildFuture --navigateToChanged"

[tasks.new]
description = "Scaffold a new post: mise run new my-post-slug"
run = 'hugo new content "posts/${1:?usage: mise run new <slug>}.md"'

[tasks.build]
description = "Build the production site into public/ (warnings are fatal)"
run = "hugo --gc --minify --panicOnWarning --printPathWarnings"

[tasks.clean]
description = "Remove build output and Hugo caches"
run = "rm -rf public resources .hugo_build.lock"

[tasks.validate]
description = "Validate every post's front matter against schemas/post.schema.json"
run = "uv run --quiet scripts/validate_content.py"

[tasks.links]
description = "Check every internal link in the built site (run build first)"
# --root-dir resolves site-absolute links such as /tags/ against public/ on
# disk. It must be absolute, so it cannot live in the committed lychee.toml.
# Without it lychee cannot even build a request for them and reports a warning,
# which would make this check silently pass on a broken link.
run = "lychee --config lychee.toml --root-dir \"{{config_root}}/public\" --no-progress public"

[tasks.lint]
description = "Run every pre-commit hook against the whole repo"
run = "pre-commit run --all-files"

[tasks."helm:lint"]
description = "Lint the blog Helm chart"
run = "helm lint charts/blog --strict"

[tasks."helm:template"]
description = "Render the blog chart manifests to stdout"
run = "helm template blog charts/blog"

[tasks."helm:docs"]
description = "Regenerate charts/blog/README.md from values.yaml"
run = "helm-docs --chart-search-root charts"

[tasks."helm:schema"]
description = "Regenerate charts/blog/values.schema.json from values.yaml"
run = "helm schema --chart-search-root charts"

[tasks."helm:test"]
description = "Run the chart unit tests"
run = "helm unittest charts/blog"

[tasks."helm:verify"]
description = "Render the chart and validate it against upstream Kubernetes schemas"
run = "helm template blog charts/blog | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.34.0"

[tasks."docker:build"]
description = "Build the container image locally as blog:dev"
run = "docker compose build"

[tasks."docker:up"]
description = "Serve the container on :8080 and rebuild it whenever content changes"
# --watch rebuilds on every write under the paths compose.yaml lists. Use
# `mise run dev` to write posts; this is for checking the container itself.
run = "docker compose up --build --watch"

[tasks."docker:preview"]
description = "Serve the container on :8080 in the background (no rebuild on change)"
run = "docker compose up --build --detach --wait"

[tasks."docker:down"]
description = "Stop and remove the local container"
run = "docker compose down --remove-orphans"

[tasks."docker:logs"]
description = "Follow the container logs"
run = "docker compose logs --follow"

[tasks."docker:lint"]
description = "Lint the Dockerfile"
run = "hadolint Dockerfile"

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.ci]
description = "Run the full CI pipeline locally, in the same order as GitHub Actions"
depends = ["lint", "validate", "build", "links", "helm:lint", "helm:test", "helm:verify", "docker:lint"]
run = "echo 'All CI checks passed.'"
