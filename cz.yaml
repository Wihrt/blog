---
commitizen:
  name: cz_conventional_commits
  tag_format: v$version
  version_scheme: semver
  # The git tag is the single source of truth for the version. The chart's
  # Chart.yaml and values.yaml are rewritten from it by the release workflow.
  version_provider: scm
  update_changelog_on_bump: true
  changelog_file: CHANGELOG.md
  major_version_zero: true
  bump_message: "chore(release): bump to v$new_version [skip ci]"
